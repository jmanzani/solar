name: Build Y2 ROM

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-y2-rom:
    name: Build Y2 ROM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install legacy Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-19" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          echo "Building Solar release APK..."
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk .

      - name: Build Y2 ROM
        run: |
          echo "Building Innioasis Y2 ROM..."
          sudo SKIP_ROCKBOX_XPOSED=1 bash solar-rom/scripts/build-rom.sh y2 \
            --apk app-release.apk \
            solar-rom/dist/rom_y2.zip

      - name: Verify ROM
        run: |
          if [ -f "solar-rom/dist/rom_y2.zip" ]; then
            echo "Y2 ROM built: $(ls -lh solar-rom/dist/rom_y2.zip)"
            unzip -l solar-rom/dist/rom_y2.zip | grep -E 'system\.img|MT6582|boot\.img'
          else
            echo "ERROR: rom_y2.zip missing"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: y2-rom
          path: solar-rom/dist/rom_y2.zip
          retention-days: 1

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: "Solar Y2 ROM v$(date +%Y%m%d-%H%M)"
          body: "Solar Y2 ROM for Innioasis Y2 (MT6582 ATA). Built from $(git rev-parse --short HEAD)."
          draft: false
          prerelease: false
          files: solar-rom/dist/rom_y2.zip
